name: CI

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # vcpkg x-gha cache 쓰기에 필요

env:
  # vcpkg 가 GitHub Actions cache 를 backend 로 사용해 deps 재빌드 회피.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            triplet: x64-windows
          - name: Linux GCC
            os: ubuntu-latest
            triplet: x64-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # vcpkg x-gha 모드는 ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN 필요.
      - name: Export GitHub Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            build-essential \
            pkg-config \
            autoconf \
            automake \
            libtool

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake / Ninja
        uses: lukka/get-cmake@latest

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # vcpkg.json 의 builtin-baseline 과 일치.
          vcpkgGitCommitId: 67b207f199b5d2ee09f206d2e9e9171e7c7a3274

      - name: CMake configure
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: CMake build
        shell: bash
        run: cmake --build build --parallel

      - name: ctest
        shell: bash
        working-directory: build
        run: ctest --output-on-failure --parallel
